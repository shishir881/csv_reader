{% extends 'layout.html' %}

{% block title %}Error Occurred{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-[60vh]">
    <div class="w-full max-w-md bg-white dark:bg-gray-800 shadow-lg rounded-2xl p-8 border border-red-100 dark:border-red-900 text-center">
        
        <div class="bg-red-100 dark:bg-red-900/30 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-red-600 dark:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
            </svg>
        </div>

        <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">Oops! Something went wrong</h2>
        
        <div class="bg-red-50 dark:bg-red-900/20 p-4 rounded-lg mb-6 text-left">
            <p class="text-red-600 dark:text-red-300 font-mono text-sm break-words">
                {{ error }}
            </p>
        </div>

        <div class="space-y-3">
            <a href="{% url 'dashboard' %}" class="block w-full bg-gray-800 hover:bg-gray-900 dark:bg-gray-700 dark:hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-lg transition">
                Go to My Datasets
            </a>
            <a href="{% url 'upload' %}" class="block w-full text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 text-sm">
                Upload a New Dataset
            </a>
        </div>

    </div>
</div>
{% endblock %}
