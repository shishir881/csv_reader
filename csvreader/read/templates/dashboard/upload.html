{% extends 'layout.html' %}

{% block title %}Upload Dataset{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-[60vh]">
    <div class="w-full max-w-lg bg-white dark:bg-gray-800 shadow-xl rounded-2xl p-8 border border-gray-100 dark:border-gray-700">
        
        <div class="text-center mb-8">
            <div class="bg-blue-100 dark:bg-blue-900 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <span class="text-3xl">📂</span>
            </div>
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Upload Your Dataset</h2>
            <p class="text-gray-500 dark:text-gray-400 mt-2">Upload a CSV file to analyze and train models automatically.</p>
        </div>

        <form method="post" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            
            <div class="relative border-2 border-dashed border-gray-300 dark:border-gray-600 rounded-lg p-6 hover:border-blue-500 transition-colors text-center">
                
                <div class="mb-4">
                    {{ form.file }}
                </div>
                
                <p class="text-xs text-gray-400">Supported format: .CSV only</p>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition transform hover:scale-105">
                Analyze Data 🚀
            </button>
        </form>

    </div>
</div>
{% endblock %}
