{% extends "layout.html" %}
{% load static %}
{% block title %}Home - CSV Reader{% endblock %}

{% block content %}
<div class="text-center">
    <h1 class="text-4xl font-bold mb-4 dark:text-gray-100">Upload Your CSV File</h1>
    <p class="text-gray-600 dark:text-gray-300 mb-6">Easily upload a CSV and visualize data.</p>

    <!-- File Upload Box -->
    <div class="flex justify-center">
        <form method="post" enctype="multipart/form-data" class="bg-white dark:bg-gray-800 p-8 rounded shadow-md w-1/2">
            {% csrf_token %}
            <input type="file" name="file" class="block w-full mb-4 border rounded dark:border-gray-600 dark:bg-gray-700">
            <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full">
                Upload CSV
            </button>
        </form>
    </div>

    <!-- Illustration -->
    {% comment %} <img src="{% static 'images/csv.jpeg' %}" class="mx-auto mt-8 opacity-80"> {% endcomment %}
</div>
{% endblock %}
