{% extends "layout.html" %}

{% block title %}Home | CSV Reader{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center text-center">

    <!-- Hero Section -->
    <h2 class="text-4xl font-bold mb-3">Upload & Read CSV Instantly</h2>
    <p class="text-gray-500 mb-10 max-w-xl">
        Easily upload any CSV file and view data in seconds — perfect for quick analysis and ML dataset preview.
    </p>

    <!-- Background image / hero image -->
    <img src="https://cdn-icons-png.flaticon.com/512/2965/2965456.png"
         alt="CSV Illustration"
         class="w-56 opacity-90 mb-8">

    <!-- Upload Box -->
    <form action="/read/" method="POST" enctype="multipart/form-data"
          class="w-full max-w-md bg-white shadow-md rounded p-6 border">
        {% csrf_token %}
        <label class="block font-medium text-left mb-2">Upload CSV File</label>
        
        <input type="file" name="csv_file"
               class="w-full border rounded px-3 py-2 mb-6 cursor-pointer focus:ring focus:border-blue-400">

        <button type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded font-semibold">
            Upload & Read File
        </button>
    </form>

</div>
{% endblock %}
