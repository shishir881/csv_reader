{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CSV Reader{% endblock %}</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    
    {% tailwind_css %}

    <style>
        /* Smooth scrolling */
        html { scroll-behavior: smooth; }
        
        /* Smooth color transitions */
        body, nav, div, p, h1, h2, h3, a, button {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 transition duration-300 min-h-screen flex flex-col">

    <nav class="bg-white dark:bg-gray-800 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center">
            
            <div class="flex items-center space-x-9">
                <a href="{% url 'upload' %}" class="flex items-center gap-2 group">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold group-hover:bg-blue-700 transition">C</div>
                    <span class="text-xl font-semibold dark:text-gray-200">CSV Reader</span>
                </a>

                <a href="{% url 'upload' %}" class="flex items-center space-x-1 hover:text-blue-600 dark:hover:text-blue-400 font-medium">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span>Home</span>
                </a>
            </div>

            <div class="flex-grow"></div>

            <div class="flex items-center space-x-4">
                
                {% if user.is_authenticated %}
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 transition shadow-sm">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-200 hover:text-blue-600">
                        Login
                    </a>
                    <a href="{% url 'signup' %}" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 transition shadow-sm">
                        Sign Up
                    </a>
                {% endif %}
                
                <button id="themeToggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition text-lg">
                    🌙
                </button>
            </div>
        </div>
    </nav>

    <div class="flex-grow container mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </div>

    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 py-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-gray-500 dark:text-gray-400 text-sm">
            &copy; 2025 CSV Reader AI.
        </div>
    </footer>

    <script>
        // --- 1. DARK MODE LOGIC ---
        const html = document.documentElement;
        const themeToggle = document.getElementById('themeToggle');

        const updateIcon = () => {
             themeToggle.textContent = html.classList.contains('dark') ? '☀️' : '🌙';
        }

        // Check Storage or System Preference
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        } else {
            html.classList.remove('dark');
        }
        updateIcon();

        // Toggle Click
        themeToggle.onclick = () => {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateIcon();
        };
    </script>
    </script>
</body>
</html>
