{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CSV Reader{% endblock %}</title>

    <!-- Load Tailwind -->
    {% tailwind_css %}
</head>
<body class="bg-gray-50 text-gray-800">
    <header class="w-full py-4 shadow bg-white">
        <div class="container mx-auto flex justify-between items-center px-6">
            <h1 class="text-xl font-semibold">CSV Reader</h1>
            <div class="space-x-3">
                <a href="/login/" class="px-4 py-2 text-sm border rounded hover:bg-gray-100">Login</a>
                <a href="/signup/" class="px-4 py-2 text-sm bg-blue-600 text-white rounded hover:bg-blue-700">Sign Up</a>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-12">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
